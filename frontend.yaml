apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: travelo}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: younessessabri/travelo-frontend:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 3000}]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        startupProbe:
          httpGet: {path: /, port: 3000}
          failureThreshold: 10
          periodSeconds: 3
        livenessProbe:
          httpGet: {path: /, port: 3000}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /, port: 3000}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: travelo}
spec:
  selector: {app: frontend}
  ports: [{port: 3000, targetPort: 3000}]