apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: travelo}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: younessessabri/travelo-backend:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: travelo-config}}]
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom: {secretKeyRef: {name: mysql-secret, key: MYSQL_ROOT_PASSWORD}}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        startupProbe:
          tcpSocket: {port: 8080}
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 10
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: travelo}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]